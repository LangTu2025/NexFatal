name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { goos: android, goarch: arm64,  ext: "" }
          - { goos: linux,   goarch: amd64,  ext: "" }
          - { goos: linux,   goarch: arm64,  ext: "" }
          - { goos: windows, goarch: amd64,  ext: ".exe" }
          - { goos: windows, goarch: arm64,  ext: ".exe" }
          - { goos: darwin,  goarch: amd64,  ext: "" }
          - { goos: darwin,  goarch: arm64,  ext: "" }
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Commit: $(git log -1 --pretty=format:%s)"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          OUTPUT="NexFatal_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"

          echo "========================================="
          echo "Building: ${OUTPUT}"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "========================================="

          garble -literals build \
            -ldflags="-s -w -checklinkname=0" \
            -o "${OUTPUT}" \
            ./cmd/cli

          if [ -f "${OUTPUT}" ]; then
            echo "Build successful: $(ls -lh "${OUTPUT}" | awk '{print $5}')"
          else
            echo "::error::Build failed"
            exit 1
          fi
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOGARBLE: github.com/LangTu2025/NexFatal,github.com/xingbaiawa/LycorisFlow,github.com/xingbaiawa/blocks,github.com/xingbaiawa/bdump,github.com/xingbaiawa/StarShuttler

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexFatal_${{ matrix.goos }}_${{ matrix.goarch }}
          path: NexFatal_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "committer=$(git log -1 --pretty=format:%an)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release (NexFatal)
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            | 项 | 值 |
            |---|---|
            | **版本** | ${{ steps.version.outputs.version }} |
            | **提交者** | ${{ steps.version.outputs.committer }} |
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

